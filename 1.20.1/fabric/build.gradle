plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = rootProject.mod_group_id
archivesBaseName = "creraces-1.20.1-fabric"

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    mixin {
        defaultRefmapName = "creraces-fabric.refmap.json"
    }
    accessWidenerPath = project(":1.20.1:common").file("src/main/resources/creraces.accesswidener")
    runs {
        // Fabric's dev client otherwise picks a fresh random offline username (and
        // therefore a new player UUID) on every launch, orphaning anything keyed to
        // the player's UUID (e.g. commanded servants) between runs. Pin it like Forge's
        // dev runs already do, so the same offline player persists across restarts.
        client {
            programArgs "--username", "Dev"
        }
    }
}



configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.property('1_20_1_fabric_api_version')}"
    modApi "dev.architectury:architectury-fabric:${rootProject.property('1_20_1_architectury_version')}"

    common(project(path: ":1.20.1:common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":1.20.1:common", configuration: "transformProductionFabric")) { transitive = false }
    implementation "com.google.code.findbugs:jsr305:3.0.2"

    // Twilight Lib - Direct File Dependency
    modImplementation files("${rootProject.projectDir.parentFile}/twilight-lib/1.20.1/fabric/build/libs/twilight_lib-1.20.1-fabric-${rootProject.twilight_lib_version}.jar")

    // Cardinal Components API
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.3"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.3"
    modImplementation "curse.maven:pehkui-319596:4684391"
    modImplementation "com.github.Virtuoel:KanosConfig:0.4.1"
    modRuntimeOnly "io.github.llamalad7:mixinextras-fabric:0.5.3"
    modRuntimeOnly "mezz.jei:jei-1.20.1-fabric:15.2.0.27"
    modImplementation "curse.maven:terrablender-fabric-565956:6290449"
    // TerraBlender-Fabric jar-in-jars NightConfig (core+toml 3.6.7) for its own config file, but
    // curse.maven jars don't carry Maven metadata for Loom to extract nested jars in dev runs.
    // Declared directly so the classes are guaranteed to be on the runtime classpath.
    implementation "com.electronwill.night-config:core:3.6.7"
    implementation "com.electronwill.night-config:toml:3.6.7"
    modImplementation "curse.maven:trinkets-341284:5173501"
}

processResources {
    inputs.property "version", project.version

    // Fabric Loader reads the accessWidener file from this mod's own resource root at
    // runtime (unlike Forge, which bakes AW into bytecode at build time), so the shared
    // file from :1.20.1:common has to be physically copied in here too.
    from(project(":1.20.1:common").file("src/main/resources/creraces.accesswidener"))

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":1.20.1:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
