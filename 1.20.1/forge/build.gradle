plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = rootProject.mod_group_id
archivesBaseName = "creraces-1.20.1-forge"

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    mixin.defaultRefmapName = "creraces-forge.refmap.json"
    accessWidenerPath = project(":1.20.1:common").file("src/main/resources/creraces.accesswidener")
    forge {
        mixinConfig "creraces-common.mixins.json"
        mixinConfig "creraces-forge.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.property('1_20_1_minecraft_version')}-${rootProject.property('1_20_1_forge_version')}"
    modImplementation "curse.maven:terrablender-563928:6290448"
    modImplementation "curse.maven:curios-309927:6418456"
    modApi "dev.architectury:architectury-forge:${rootProject.property('1_20_1_architectury_version')}"

    common(project(path: ":1.20.1:common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":1.20.1:common", configuration: "transformProductionForge")) { transitive = false }
    
    // Twilight Lib - Direct File Dependency
    modImplementation files("${rootProject.projectDir.parentFile}/twilight-lib/1.20.1/forge/build/libs/twilight_lib-1.20.1-forge-${rootProject.twilight_lib_version}.jar")
    modImplementation "curse.maven:pehkui-319596:5393101"
    forgeRuntimeLibrary "io.github.llamalad7:mixinextras-common:0.5.3"
    modRuntimeOnly "mezz.jei:jei-1.20.1-forge:15.2.0.27"
}

processResources {
    var replaceProperties = [
            minecraft_version: rootProject.property('1_20_1_minecraft_version'),
            minecraft_version_range: "[1.20.1,1.21)",
            forge_version: rootProject.property('1_20_1_forge_version'),
            forge_version_range: "[47,)",
            loader_version_range: "[37,)",
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_license: rootProject.mod_license,
            mod_version: rootProject.mod_version,
            mod_authors: rootProject.mod_authors,
            mod_description: rootProject.mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":1.20.1:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
