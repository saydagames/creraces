modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="creraces-common.mixins.json"

[[mixins]]
config="creraces-neoforge.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="architectury"
type="required"
versionRange="[${architectury_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="twilight_lib"
type="required"
versionRange="[2.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="pehkui"
type="required"
versionRange="[3.8.0,)"
ordering="NONE"
side="BOTH"
